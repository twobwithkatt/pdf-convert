name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Tesseract OCR on Windows Runner
      run: |
        choco install tesseract --no-progress
        echo "TESSERACT_PATH=C:\Program Files\Tesseract-OCR" >> $env:GITHUB_ENV

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Standalone EXE with Embedded Tesseract
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --name "PDFSerialRenamer" `
          --add-data "ui/style.qss;ui" `
          --add-data "C:\Program Files\Tesseract-OCR;tesseract_engine" `
          main.py

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PDFSerialRenamer-Windows-x64
        path: dist/PDFSerialRenamer.exe

    - name: Create or Update Public GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        name: "PDF Serial Renamer v1.0 (Windows Standalone)"
        body: |
          ### 🚀 Phiên bản PDF Serial Renamer tự động cho Windows
          - Tải trực tiếp file `PDFSerialRenamer.exe` bên dưới về máy Windows để sử dụng ngay.
          - Đã tích hợp sẵn OCR, không cần cài đặt thêm bất kỳ phần mềm nào.
        files: dist/PDFSerialRenamer.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
